name: Java CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {java-version: '17', distribution: temurin}
      - run: javac 'console calculator/Calculator.java' CalculatorTest.java
      - run: java -cp '.:console calculator' CalculatorTest